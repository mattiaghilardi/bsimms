# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Vignette chunks are gated on `params$EVAL` (see vignettes/*.Rmd), so
      # NOT_CRAN must be set here for the site to show real output/figures
      # rather than bare, un-evaluated code.
      NOT_CRAN: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      # cmdstanr is not on CRAN, so let pak install only the hard
      # dependencies (Imports) and specify the Suggests packages needed to
      # build the vignettes/site manually, sourcing cmdstanr from its
      # GitHub repo.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          extra-packages: |
            any::pkgdown
            local::.
            any::bayesplot
            any::ggplot2
            any::knitr
            any::loo
            any::markdown
            any::rmarkdown
            any::rstan
            any::rstantools
            any::BH
            any::RcppEigen
            stan-dev/cmdstanr

      - name: Install CmdStan
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(cores = parallel::detectCores())
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
