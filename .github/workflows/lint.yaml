# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      # cmdstanr is not on CRAN, so let pak install only the hard
      # dependencies (Imports) and specify the Suggests packages needed for
      # linting manually, sourcing cmdstanr from its GitHub repo. The
      # package itself (local::.) must also be installed, not just its
      # dependencies, so lintr::lint_package() can resolve internal,
      # package-local function calls (object_usage_linter) correctly.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          extra-packages: |
            local::.
            any::lintr
            any::bayesplot
            any::ggplot2
            any::knitr
            any::loo
            any::markdown
            any::rmarkdown
            any::rstan
            any::rstantools
            any::testthat
            any::BH
            any::RcppEigen
            stan-dev/cmdstanr

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
